<!doctype html>
<html lang="zh-CN" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="用九章互动实验拆开 Transformer，从分词一路算到下一个 token。">
<title>Transformer 拆解手账</title>
<style>
:root {
  color-scheme: light;
  --paper: #f4ebe0;
  --sheet: #fff9f1;
  --canvas: #faf3e9;
  --quiet: #efe4d7;
  --border: #dacabc;
  --grid: #e9ddce;
  --ink: #342820;
  --muted: #695a4e;
  --accent: #983e2b;
  --accent-ink: #fff8f0;
  --tint: #f3ded3;
  --green: #37665d;
  --mint: #e1ebe3;
  --gold: #795b28;
  --wheat: #f1e5ca;
  --violet: #625473;
  --lavender: #ece4f0;
  --wire: #886d58;
  --shadow: 0 5px 18px #64432b0b;
  --serif: Georgia, "Songti SC", "Noto Serif CJK SC", "SimSun", serif;
  --sans: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Consolas, monospace;
}
:root[data-theme="night"] {
  color-scheme: dark;
  --paper: #211e1a;
  --sheet: #2a2520;
  --canvas: #27231f;
  --quiet: #332b25;
  --border: #514237;
  --grid: #372f28;
  --ink: #f7e8d6;
  --muted: #c4ae99;
  --accent: #f0a28a;
  --accent-ink: #321d16;
  --tint: #462e27;
  --green: #a1cbbd;
  --mint: #2c3b34;
  --gold: #e6c485;
  --wheat: #3c3324;
  --violet: #d5bde7;
  --lavender: #392e43;
  --wire: #ba9b80;
  --shadow: 0 5px 18px #140e0a22;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  min-width: 300px;
  background: var(--paper);
  color: var(--ink);
  font: 16px/1.6 var(--sans);
  transition: background-color .25s, color .25s;
}
button, input { font: inherit; }
button {
  color: var(--ink);
  cursor: pointer;
}
button:disabled { cursor: default; opacity: .43; }
button:focus-visible, a:focus-visible, summary:focus-visible, input:focus-visible, [role="button"]:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}
a { color: var(--accent); }
h1, h2, h3, p { margin: 0; }
svg { display: block; }
small { font-size: .82rem; }
.wrap { width: min(1456px, calc(100% - 80px)); margin-inline: auto; }
.masthead { border-bottom: 1px solid var(--border); }
.masthead__inner { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 66px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 750; letter-spacing: .045em; font-size: .91rem; }
.brand__mark { color: var(--accent); background: var(--tint); border: 1px solid var(--border); border-radius: 8px; padding: 6px; }
.theme-button { white-space: nowrap; }
.control, .choice, .token-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-height: 35px;
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 5px 11px;
  background: var(--sheet);
  font-size: .875rem;
  line-height: 1.35;
  transition: border-color .18s, background-color .18s, color .18s, transform .18s;
}
.control:hover:not(:disabled), .choice:hover, .token-button:hover { border-color: var(--accent); color: var(--accent); }
.control:active:not(:disabled), .choice:active, .token-button:active { transform: translateY(1px); }
.control--primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.control--primary:hover:not(:disabled) { color: var(--accent-ink); filter: brightness(.92); }
[aria-pressed="true"].choice, [aria-pressed="true"].token-button {
  color: var(--accent);
  background: var(--tint);
  border-color: var(--accent);
  font-weight: 650;
}
.hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 22px; padding-block: 24px 19px; }
.eyebrow { display: flex; align-items: center; gap: 8px; color: var(--accent); font-size: .85rem; font-weight: 750; letter-spacing: .11em; }
.eyebrow::before { content: ""; width: 19px; border-top: 1px solid currentColor; }
.hero h1 { margin: 8px 0 7px; font: 700 clamp(2rem, 4.1vw, 3.7rem)/1.17 var(--serif); letter-spacing: -.045em; }
.hero h1 span { color: var(--accent); white-space: nowrap; }
.hero p { color: var(--muted); font-size: .98rem; }
.hero__route { display: flex; align-items: center; gap: 9px; margin-bottom: 5px; color: var(--muted); font: .82rem var(--mono); white-space: nowrap; }
.hero__route span:not(.route-arrow) { padding: 6px 10px; border: 1px solid var(--border); border-radius: 7px; background: var(--sheet); }
.route-arrow { color: var(--accent); }
.course { display: grid; grid-template-columns: 208px minmax(0, 1fr) 286px; align-items: start; gap: 16px; }
.rail, .stage, .notes { min-width: 0; background: var(--sheet); border: 1px solid var(--border); border-radius: 13px; box-shadow: var(--shadow); }
.rail, .notes { position: sticky; top: 14px; }
.rail { padding: 16px 11px 13px; }
.rail__heading, .notes__header, .stage__heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.rail__heading { margin: 0 7px 12px; }
.rail__heading h2, .notes__header h2 { font-size: .97rem; }
.rail__heading span, .notes__header span, .stage__index { font: .75rem var(--mono); color: var(--muted); white-space: nowrap; }
.rail__list { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; }
.rail__link {
  width: 100%; min-height: 40px; display: flex; align-items: center; gap: 10px;
  text-align: left; padding: 6px 8px; border: 1px solid transparent; border-radius: 7px; background: none;
  font-size: .88rem; line-height: 1.35;
}
.rail__link:hover { background: var(--quiet); }
.rail__link[aria-current="step"] { border-color: var(--border); background: var(--tint); color: var(--accent); font-weight: 750; }
.rail__number { font: .77rem var(--mono); color: var(--muted); }
.rail__link[aria-current="step"] .rail__number { color: inherit; }
.rail__position { margin: 14px 6px 2px; display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; }
.rail__position span { height: 3px; border-radius: 5px; background: var(--border); }
.rail__position .is-past { background: var(--accent); }
.stage { overflow: clip; }
.stage__heading { min-height: 61px; padding: 11px 17px; flex-wrap: wrap; }
.stage__title { display: flex; align-items: center; gap: 10px; min-width: 0; }
.stage__title h2 { font-size: 1.12rem; line-height: 1.27; }
.stage__index {
  padding: 5px 7px; border-radius: 6px; color: var(--accent);
  background: var(--tint); font-size: .82rem; font-weight: 700;
}
.hud { display: flex; gap: 5px; flex-wrap: wrap; }
.chip { max-width: 100%; padding: 3px 7px; background: var(--quiet); border: 1px solid var(--border); border-radius: 5px; color: var(--muted); font-size: .77rem; overflow-wrap: anywhere; }
.chip--live { color: var(--green); background: var(--mint); }
.stage__source {
  display: flex; gap: 8px; align-items: baseline;
  padding: 8px 17px; border-block: 1px solid var(--border);
  background: var(--quiet); font-size: .82rem; color: var(--muted);
}
.stage__source b { color: var(--accent); flex-shrink: 0; }
.stage__canvas {
  display: flex; flex-direction: column; align-items: center;
  overflow: auto; max-height: clamp(390px, calc(100dvh - 408px), 650px); min-height: 475px;
  padding: 12px 15px; background-color: var(--canvas);
  background-image: linear-gradient(to right, var(--grid) 1px, transparent 1px), linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size: 20px 20px;
  scrollbar-color: var(--border) var(--canvas);
}
.lesson { flex: none; width: min(100%, 880px); margin: auto 0; min-width: 0; }
.lesson__tools { display: flex; justify-content: space-between; gap: 8px 10px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
.choices { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; min-width: 0; }
.choices__label { font-size: .83rem; color: var(--muted); margin-right: 3px; }
.stage__controls { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 11px 14px; border-top: 1px solid var(--border); }
.stage__controls .control:first-child { justify-self: start; }
.stage__controls .control:last-child { justify-self: end; }
.notes { padding: 16px 15px; }
.notes__header { padding-bottom: 12px; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
.notes__header div { display: flex; align-items: center; gap: 8px; }
.notes__header svg { color: var(--accent); }
.aside__steps { display: grid; gap: 5px; margin-bottom: 13px; }
.aside__steps .choice { width: 100%; justify-content: flex-start; text-align: left; padding-inline: 8px; }
.step-no { color: var(--accent); font: .72rem var(--mono); flex: none; }
.note-page h3 { font: 700 1.38rem/1.35 var(--serif); margin-bottom: 8px; }
.note-page p { color: var(--muted); font-size: .91rem; }
.note-page blockquote { color: var(--ink); font-size: .87rem; background: var(--tint); border-left: 2px solid var(--accent); margin: 13px 0; padding: 8px 9px; border-radius: 0 6px 6px 0; }
details { border: 1px solid var(--border); background: var(--canvas); border-radius: 8px; margin-top: 12px; font-size: .86rem; }
summary { cursor: pointer; padding: 8px 9px; color: var(--accent); font-weight: 650; }
.math { font: .82rem/1.62 var(--mono); overflow-wrap: anywhere; }
details .math { border-top: 1px solid var(--border); padding: 9px; }
details .math p + p { margin-top: 7px; }
.footer { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px 20px; padding-block: 15px 24px; color: var(--muted); font-size: .8rem; }
.keys { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; }
kbd { border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; background: var(--sheet); color: var(--ink); padding: 1px 5px; font: .73rem var(--mono); }
.keys span + kbd { margin-left: 9px; }
.scroll-x { max-width: 100%; overflow-x: auto; }
.arch__svg { width: 100%; max-width: 535px; min-width: 470px; margin: auto; overflow: visible; }
.arch__svg--single { max-width: 316px; min-width: 0; }
.arch__frame { fill: var(--sheet); fill-opacity: .59; stroke: var(--wire); stroke-width: 1.15; stroke-dasharray: 5 5; }
.arch__wire, .arch__bridge, .arch__residual { fill: none; stroke: var(--wire); stroke-width: 1.45; opacity: .82; transition: stroke .3s, opacity .3s, stroke-width .3s; }
.arch__bridge { stroke: var(--green); stroke-width: 1.8; }
.arch__residual { stroke-dasharray: 4 3; }
.arch__wire.is-emphasis, .arch__bridge.is-emphasis, .arch__residual.is-emphasis { opacity: 1; stroke-width: 2.3; }
.arch__node { cursor: pointer; color: var(--ink); }
.arch__node rect, .arch__node circle { fill: var(--sheet); stroke: var(--border); stroke-width: 1.1; transition: fill .3s, stroke .3s; }
.arch__node.is-emphasis rect, .arch__node.is-emphasis circle { stroke: var(--wire); }
.arch__node:hover rect, .arch__node:hover circle, .arch__node:focus-visible rect, .arch__node:focus-visible circle { stroke: var(--accent); stroke-width: 2; }
.arch__node.tint rect, .arch__node.tint circle { fill: var(--tint); }
.arch__node.mint rect { fill: var(--mint); }
.arch__node.wheat rect { fill: var(--wheat); }
.arch__node.lavender rect { fill: var(--lavender); }
.arch__node.arch__terminal:not(:hover):not(:focus-visible) rect { fill: transparent; stroke: transparent; }
.arch__wave { fill: none; stroke: var(--violet); stroke-width: 1.3; }
.arch__label { fill: var(--ink); font-size: 13px; font-weight: 650; }
.arch__eyebrow { fill: var(--muted); font-size: 12px; }
.arch__heading { fill: var(--accent); font-size: 14px; font-weight: 750; letter-spacing: .05em; }
.arch__bridge-label { fill: var(--green); font: 11px var(--mono); }
.arch__caption { display: flex; align-items: center; justify-content: center; gap: 4px 13px; flex-wrap: wrap; color: var(--muted); font-size: .78rem; text-align: center; margin-top: 4px; }
.arch__legend { display: inline-flex; align-items: center; gap: 5px; }
.legend-line { width: 19px; border-top: 2px solid var(--green); }
.legend-line--residual { border-top: 2px dashed var(--wire); }
.diagram-cue { color: var(--accent); }
.diagram-cue--scroll { display: none; }
.card, .worked { min-width: 0; border: 1px solid var(--border); border-radius: 8px; background: var(--sheet); padding: 10px; }
.card h3, .worked h3 { margin-bottom: 5px; font-size: .93rem; }
.card p, .worked p { color: var(--muted); }
.worked { border-left: 2px solid var(--accent); }
.stack { display: grid; gap: 9px; }
.two-up, .three-up { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.three-up { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.step-focus { transition: border-color .27s, background-color .27s, box-shadow .27s; }
.step-focus.is-current { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.hint { font-size: .84rem; color: var(--muted); }
.rule { color: var(--accent); font-weight: 650; }
.term-row { display: flex; gap: 6px; align-items: stretch; flex-wrap: wrap; }
.token-button { min-width: 39px; }
.token-strip { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px; min-height: 67px; }
.token-strip__raw { background: var(--wheat); border: 1px solid var(--border); color: var(--gold); font: 700 1.57rem var(--serif); border-radius: 6px; padding: 7px 14px; }
.scissors { display: inline-block; color: var(--accent); transform-origin: 60% 60%; transition: transform .3s; font-size: 1.4rem; }
.is-cut .scissors { transform: rotate(-31deg) scale(1.14); }
.token-card {
  display: grid; text-align: center; gap: 3px; min-width: 49px;
  padding: 6px; border: 1px solid var(--border); border-radius: 7px;
  background: var(--mint); color: var(--green); transition: transform .35s, background-color .35s;
}
.is-cut .token-card { transform: translateY(-3px); }
.token-strip .token-card { transition: transform .35s, opacity .3s; }
.token-strip:not(.is-cut) .token-card { opacity: 0; transform: translateX(-7px); }
.token-card small { font: .72rem var(--mono); color: var(--muted); min-height: 1em; }
.vocab { display: grid; grid-template-columns: repeat(auto-fit, minmax(54px, 1fr)); gap: 6px; }
.vocab .choice { display: flex; flex-wrap: wrap; }
.vocab .choice[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); background: var(--tint); }
.roster { grid-template-columns: repeat(auto-fit, minmax(72px, 1fr)); }
.roster__entry {
  display: flex; align-items: center; justify-content: space-between; gap: 4px;
  min-height: 38px; padding: 4px 6px;
  border: 1px solid var(--border); border-radius: 7px;
  background: var(--quiet); color: var(--muted);
  transition: background-color .25s, border-color .25s, color .25s;
}
.roster__id {
  min-width: 22px; padding: 4px; border-radius: 4px; text-align: center;
  font: .88rem/1 var(--mono);
  transition: background-color .25s, color .25s;
}
.roster__entry.in-example {
  border-color: var(--green); background: var(--mint); color: var(--green); font-weight: 750;
}
.roster__entry.in-example .roster__id { background: var(--green); color: var(--sheet); font-weight: 750; }
.matrix-box { min-width: 0; }
.matrix { border-collapse: separate; border-spacing: 2px; width: max-content; min-width: 100%; text-align: center; font: .78rem/1.25 var(--mono); }
.matrix caption { text-align: left; font: 650 .84rem/1.36 var(--sans); color: var(--ink); margin-bottom: 4px; }
.matrix td, .matrix th { padding: 4px 4px; border-radius: 3px; min-width: 27px; white-space: nowrap; }
.matrix td { background: var(--quiet); color: var(--ink); transition: background-color .25s, color .25s; }
.matrix th { color: var(--muted); font-weight: 500; }
.matrix tbody th { text-align: left; }
.matrix td.is-selected, .matrix tr.is-selected td { background: var(--tint); color: var(--accent); font-weight: 750; }
.matrix th button { padding: 2px 3px; min-width: 25px; min-height: 25px; font: inherit; }
.handoff { margin-bottom: 12px; border-color: var(--wire); }
.handoff__tools { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px 12px; margin-bottom: 8px; }
.handoff__tools h3 { margin: 0; }
.handoff__tools .token-button { min-height: 30px; }
.handoff__flow { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: start; gap: 6px; }
.handoff__side { min-width: 0; display: grid; gap: 5px; padding: 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--canvas); }
.handoff__side:last-child { border-color: var(--green); }
.handoff__side h4 { margin: 0; color: var(--muted); font-size: .78rem; }
.handoff__side p { color: var(--ink); }
.handoff__datum { min-width: 0; }
.handoff__datum + .handoff__datum { border-top: 1px solid var(--border); padding-top: 5px; }
.handoff__datum b, .handoff__arrow { color: var(--green); }
.handoff__arrow { align-self: center; font-weight: 750; }
.handoff__trace { margin-bottom: 8px; }
.vector { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.vector span { background: var(--quiet); border-radius: 4px; padding: 4px 5px; font: .79rem var(--mono); }
.vector span.is-selected { color: var(--accent); background: var(--tint); font-weight: 750; }
.slider-row { display: flex; flex-wrap: wrap; align-items: center; gap: 5px 10px; }
.slider-row label { color: var(--ink); font-size: .875rem; font-weight: 650; }
.slider-row output { min-width: 30px; color: var(--accent); font-family: var(--mono); }
input[type="range"] { accent-color: var(--accent); min-height: 26px; max-width: 100%; }
.clocks { display: flex; justify-content: space-around; gap: 8px; flex-wrap: wrap; }
.clock { display: grid; justify-items: center; text-align: center; flex: 1 1 125px; }
.clock svg { width: 100px; height: 100px; }
.clock__face { fill: var(--canvas); stroke: var(--wire); }
.clock__axis { stroke: var(--border); }
.clock__hand { color: var(--accent); transform-origin: 50px 50px; transition: transform .36s cubic-bezier(.22,.65,.28,1); }
.clock:nth-child(2) .clock__hand { color: var(--green); }
.clock__hand line { stroke: currentColor; stroke-width: 3; stroke-linecap: round; }
.clock__hand circle { fill: currentColor; }
.clock__axis-label { font: 8px var(--mono); fill: var(--muted); }
.stamp .matrix td { background: var(--tint); color: var(--accent); }
.attn-graph { width: 100%; height: 111px; }
.attn-graph path { fill: none; stroke: var(--green); transition: stroke-width .35s, opacity .35s, stroke .35s; }
.attn-graph path.is-masked { stroke: var(--wire); stroke-dasharray: 3 4; }
.attn-graph rect { fill: var(--mint); stroke: var(--border); }
.attn-graph .is-masked rect { fill: var(--quiet); }
.attn-graph text { fill: var(--ink); font-size: 13px; dominant-baseline: middle; text-anchor: middle; }
.attn-graph .is-masked text { fill: var(--muted); }
.cake { display: flex; height: 17px; margin: 6px 0; border-radius: 5px; overflow: hidden; background: var(--quiet); }
.cake > span { flex: 0 0 var(--portion, 0%); background: var(--accent); transition: flex-basis .4s; }
.cake > span:nth-child(3n+2) { background: var(--green); }
.cake > span:nth-child(3n+3) { background: var(--gold); }
.cake-labels .token-card { border-top: 2px solid var(--accent); }
.cake-labels .token-card:nth-child(3n+2) { border-top-color: var(--green); }
.cake-labels .token-card:nth-child(3n+3) { border-top-color: var(--gold); }
.bars { display: grid; gap: 3px; margin-top: 6px; }
.bar { display: grid; grid-template-columns: 17px minmax(31px, 40px) 1fr; align-items: center; gap: 5px; font: .76rem var(--mono); }
.bar i { width: var(--amount, 0%); min-height: 7px; border-radius: 3px; background: var(--accent); transition: width .34s; }
.bar i.is-negative { background: var(--green); }
.bulbs { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; }
.bulb { display: grid; justify-items: center; gap: 3px; min-width: 0; padding: 5px 1px; }
.bulb svg { width: 23px; height: 24px; stroke: var(--muted); fill: var(--quiet); transition: fill .3s, stroke .3s; }
.bulb.is-on svg { fill: var(--wheat); stroke: var(--gold); }
.bulb small { font: .65rem var(--mono); }
.prob-track { display: inline-block; position: relative; min-width: 52px; width: 100%; height: 5px; background: var(--border); border-radius: 5px; vertical-align: middle; }
.prob-track i { position: absolute; inset: 0 auto 0 0; width: var(--portion, 0%); border-radius: 5px; background: var(--green); transition: width .4s; }
.candidate--winner { color: var(--accent) !important; font-weight: 750 !important; }
@media (max-width: 1270px) {
  .wrap { width: calc(100% - 42px); }
  .course { grid-template-columns: 174px minmax(0, 1fr) 248px; gap: 12px; }
  .notes { padding-inline: 12px; }
}
@media (max-width: 1010px) {
  .course { grid-template-columns: 147px minmax(0, 1fr) 216px; gap: 10px; }
  .wrap { width: calc(100% - 26px); }
  .rail { padding-inline: 7px; }
  .rail__link { gap: 6px; padding-inline: 5px; }
  .three-up { grid-template-columns: 1fr; }
}
@media (max-width: 860px) {
  .course { grid-template-columns: minmax(0, 1fr) 229px; }
  .rail { grid-column: 1 / -1; position: static; }
  .rail__list { display: flex; overflow-x: auto; }

<script>
"use strict";

// 同一套教学参数服务于所有章节。词表下标就是 token ID。
const VOCAB = ["狗", "咬", "人", "我", "爱", "吃", "苹果", "买", "手机"];
const EMBEDDINGS = [
  [.70, -.20, .10, .50], [.15, .65, -.30, .20], [-.10, .45, .75, -.25],
  [.30, .10, .60, -.35], [.55, -.45, .20, .15], [-.25, .70, .35, .10],
  [.80, .20, -.50, .25], [.10, -.35, .65, .45], [-.20, .50, -.10, .80]
];
const PRESETS = ["狗咬人", "人咬狗", "我爱吃苹果", "我吃苹果", "买苹果手机"];
const LEARNED = {
  Q: [[.60, -.20, .25, .10], [.20, .55, -.30, .15], [-.15, .35, .65, -.20], [.30, .10, .25, .70]],
  K: [[.45, .20, -.25, .10], [-.25, .60, .15, .20], [.35, -.10, .55, .15], [.10, .25, -.20, .65]],
  V: [[.75, -.10, .25, .15], [.10, .60, .20, -.35], [-.20, .30, .70, .20], [.25, .15, -.35, .65]]
};
const WO = [[.7, .2, -.2, .1], [-.3, .6, .2, .1], [.25, -.15, .65, .2], [.15, .1, -.25, .75]];
const W1 = [
  [.55, -.35, .45, .10, -.45, .30, .15, -.25],
  [.20, .60, -.25, .45, .35, -.20, -.45, .15],
  [-.40, .15, .65, -.35, .25, .55, .15, -.40],
  [.35, -.25, .15, .55, -.20, .20, .60, .40]
];
const B1 = [.05, 0, -.10, .10, 0, -.05, .05, -.10];
const W2 = [
  [.45, .15, -.20, .30], [-.30, .50, .20, .10], [.15, -.40, .60, .20], [.25, .35, -.20, .45],
  [-.40, .20, .35, -.10], [.50, -.20, .15, -.35], [.10, .45, -.25, .30], [-.15, .20, .40, .50]
];
const B2 = [0, .05, -.05, .10];
const LM_ROWS = [
  [.25, .10, -.35, .40], [.60, -.55, .15, .05], [-.35, .70, .20, -.25],
  [.10, .15, .55, -.45], [.60, .15, -.30, -.15], [.35, -.10, .70, .20],
  [-.25, .65, -.45, .35], [.20, -.40, .65, -.15], [-.55, .30, .15, .65]
];
const EPSILON = 1e-5;
const vocabIds = new Map(VOCAB.map((word, i) => [word, i]));
const matchingOrder = [...VOCAB].sort((a, b) => b.length - a.length);
const range = n => Array.from({length: n}, (_, i) => i);
const add = (a, b) => a.map((value, i) => value + b[i]);
const dot = (a, b) => a.reduce((sum, value, i) => sum + value * b[i], 0);
const column = (matrix, i) => matrix.map(row => row[i]);
const project = (row, weights) => weights[0].map((_, i) => dot(row, column(weights, i)));
const sum = values => values.reduce((total, value) => total + value, 0);
function tokenize(text) {
  const tokens = [];
  let rest = text.replace(/\s/gu, "");
  while (rest.length) {
    const match = matchingOrder.find(word => rest.startsWith(word));
    if (!match) throw new Error("词表中没有这个片段：" + rest);
    tokens.push(match);
    rest = rest.slice(match.length);
  }
  return tokens;
}
function initialWeights() {
  // 固定随机种子让切换前后始终能比较同两套参数。
  let seed = 4127;
  const draw = () => {
    seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
    return Math.round((seed / 4294967296 - .5) * 140) / 100;
  };
  return Object.fromEntries(["Q", "K", "V"].map(kind => [kind, range(4).map(() => range(4).map(draw))]));
}
const INITIAL = initialWeights();
const PE = pos => [Math.sin(pos), Math.cos(pos), Math.sin(pos / 100), Math.cos(pos / 100)];
function softmax(scores) {
  const exps = scores.map(value => Math.exp(value));
  const total = sum(exps);
  return {exps, total, probabilities: exps.map(value => value / total)};
}
function normalize(input) {
  const mean = sum(input) / input.length;
  const centered = input.map(value => value - mean);
  const variance = sum(centered.map(value => value ** 2)) / input.length;
  const sigma = Math.sqrt(variance + EPSILON);
  return {input, mean, centered, variance, sigma, out: centered.map(value => value / sigma)};
}
function computePipeline(tokens, causal, {positionStart = 0, initialized = false, spike = 1, tied = false} = {}) {
  if (tokens.length === 0) throw new Error("至少需要一个 token");
  const ids = tokens.map(word => {
    if (!vocabIds.has(word)) throw new Error("未登记的 token：" + word);
    return vocabIds.get(word);
  });
  const E = ids.map(id => EMBEDDINGS[id]);
  const positions = tokens.map((_, i) => positionStart + i);
  const P = positions.map(PE);
  const X = E.map((row, i) => add(row, P[i]));
  const weights = initialized ? INITIAL : LEARNED;
  const [Q, K, V] = ["Q", "K", "V"].map(kind => X.map(row => project(row, weights[kind])));
  const heads = range(2).map(head => {
    const split = matrix => matrix.map(row => row.slice(head * 2, head * 2 + 2));
    const q = split(Q), k = split(K), v = split(V);
    const rows = q.map((query, i) => {
      const dots = k.map(key => dot(query, key));
      const scores = dots.map(value => value / Math.sqrt(2));
      const masked = scores.map((value, j) => causal && j > i ? -Infinity : value);
      const distribution = softmax(masked);
      const weighted = v.map((row, j) => row.map(value => value * distribution.probabilities[j]));
      const out = range(2).map(dimension => sum(column(weighted, dimension)));
      return {dots, scores, masked, ...distribution, weighted, out};
    });
    return {q, k, v, rows};
  });
  const concat = tokens.map((_, i) => heads.flatMap(head => head.rows[i].out));
  const attnOut = concat.map(row => project(row, WO));
  const branch = attnOut.map(row => row.map((value, i) => i === 0 ? value * spike : value));
  const norm1 = X.map((row, i) => normalize(add(row, branch[i])));
  const H = norm1.map(result => result.out);
  const hidden = H.map(row => add(project(row, W1), B1));
  const relu = hidden.map(row => row.map(value => Math.max(0, value)));
  const ffnOut = relu.map(row => add(project(row, W2), B2));
  const norm2 = H.map((row, i) => normalize(add(row, ffnOut[i])));
  const Y = norm2.map(result => result.out);
  const last = Y.at(-1);
  const lmRows = tied ? EMBEDDINGS : LM_ROWS;
  const logits = lmRows.map(row => dot(last, row));
  const lm = softmax(logits);
  const winner = logits.indexOf(Math.max(...logits));
  return {tokens, ids, E, positions, P, X, weights, Q, K, V, heads, concat, attnOut, branch,
    norm1, H, hidden, relu, ffnOut, norm2, Y, last, lmRows, logits, lm, winner};
}

  const incoming = textLine(up);

  const w1 = matrix("W₁ · 4×8", 8, selectNeuron);
  const bias1 = node("p", "math", "b₁ = " + vectorText(B1));
  const pre = node("p", "math");
  const allUp = formulaDetails("展开 W₁ 的 8 列乘加", 8);
  put(up, w1.root, bias1, pre, allUp.root);
  const gates = card("8 盏 ReLU 灯 · 点一盏看算式", 1);
  const bulbs = range(8).map(i => bulb(i, selectNeuron));
  const on = node("p", "math");
  const activation = node("p", "math");
  put(gates, put(node("div", "bulbs"), ...bulbs.map(item => item.root)), on, activation);
  const down = card("W₂ · 缩回 4 格", 2);
  const w2 = matrix("W₂ · 8×4", 4, i => { state.ffnColumn = i; setStep(2, {reveal: false}); });
  const bias2 = node("p", "math", "b₂ = " + vectorText(B2));
  const downFormula = node("p", "math");
  const ffn = node("p", "math");
  const allDown = formulaDetails("展开 W₂ 的 4 列乘加", 4);
  put(down, w2.root, bias2, downFormula, ffn, allDown.root);
  const second = card("第二次 Add & Norm", 3, true);
  const added = textLine(second);
  const formulas = range(4).map(() => textLine(second));
  put(root, put(node("div", "stack"), up, gates, down, second));
  return {update() {
    const i = state.row, j = state.neuron;
    const col = state.ffnColumn;
    const h = model.H[i];
    const z = model.hidden[i];
    const a = model.relu[i];
    const result = model.norm2[i];
    const upFormulas = range(8).map(k => "z" + (k + 1) + " = " + terms(h, column(W1, k)) + " + (" +
      fmt(B1[k]) + ") ≈ " + fmt(z[k]));
    const downFormulas = range(4).map(k => "ffnOut 第 " + (k + 1) + " 格 = " + terms(a, column(W2, k)) +
      " + (" + fmt(B2[k]) + ") ≈ " + fmt(model.ffnOut[i][k]));
    label(incoming, "h · 矩阵 H 的第 " + (i + 1) + " 行 = " + vectorText(h));
    w1.update(W1, [], {col: j});
    label(pre, "z = " + vectorText(z));
    allUp.update(upFormulas);
    bulbs.forEach(({root, value}, k) => {
      const lit = z[k] > 0;
      root.classList.toggle("is-on", lit);
      root.setAttribute("aria-pressed", k === j);
      root.setAttribute("aria-label", "第 " + (k + 1) + " 盏灯，" + (lit ? "亮" : "灭") + "，输出 " + fmt(a[k]));
      label(value, fmt(a[k], 2));
    });
    label(on, upFormulas[j] + "；ReLU(" + fmt(z[j]) + ") = max(0, " + fmt(z[j]) + ") ≈ " + fmt(a[j]));
    label(activation, "a = " + vectorText(a));
    w2.update(W2, [], {col});
    label(downFormula, downFormulas[col]);
    label(ffn, "ffnOut = " + vectorText(model.ffnOut[i]) + " · 送进第二次 Add & Norm");
    allDown.update(downFormulas);
    label(added, "v = h + ffnOut = " + vectorText(h) + " + " + vectorText(model.ffnOut[i]) + " ≈ " + vectorText(result.input));
    normLines(result).forEach((line, k) => label(formulas[k], line));
  }};
}
function mountReadout(root) {
  const tie = choiceSet(["独立 W_lm", "与词向量表共享"], i => { state.tied = Boolean(i); modelChanged(); }, "词表投影参数");
  const generate = button("吐出下一词并接龙", () => {
    if (!state.causal) {
      state.causal = true;
      modelChanged();
      return;
    }
    const word = VOCAB[model.winner];
    state.history.push({word, probability: model.lm.probabilities[model.winner]});
    state.tokens = [...state.tokens, word];
    state.row = state.tokens.length - 1;
    state.step = 2;
    modelChanged();
    revealPhase();
  }, "control control--primary");
  const reset = button("清除接龙", () => setPreset(state.preset), "control");
  const input = card("末尾词 · 对整个词表逐一打分", 0);
  const last = textLine(input);
  const weight = textLine(input);
  const dotProduct = textLine(input);
  const probability = card("全词表 · 指数、总和与除法", 1);
  const denominator = textLine(probability);
  const table = node("table", "matrix lm-table");
  const header = node("tr");
  for (const value of ["候选词", "W_lm 的四维列", "分数 x", "e^x / 指数总和", "概率"]) {
    const th = node("th", "", value);
    th.scope = "col";
    header.append(th);
  }
  const body = node("tbody");
  put(table, put(node("thead"), header), body);
  const candidates = VOCAB.map((word, id) => {
    const pick = button(word, () => { state.candidate = id; setStep(0, {reveal: false}); });
    const term = put(node("th"), pick);
    term.scope = "row";
    const weights = node("td"), score = node("td"), exp = node("td");
    const fill = node("i");
    const track = put(node("span", "prob-track"), fill);
    track.setAttribute("aria-hidden", "true");
    const percentLabel = node("span");
    const distribution = put(node("td"), percentLabel, track);
    put(body, put(node("tr"), term, weights, score, exp, distribution));
    return {pick, weights, score, exp, percentLabel, fill};
  });
  probability.append(put(node("div", "scroll-x"), table));
  const output = card("自回归接龙 · 新词回到入口", 2, true);
  const sequence = textLine(output);
  const prediction = textLine(output);
  const history = textLine(output);
  history.setAttribute("aria-live", "polite");
  put(root, put(node("div", "lesson__tools"), tie.root, put(node("div", "choices"), generate, reset)),
    put(node("div", "stack"), input, probability, output));
  return {update() {
    tie.update(+state.tied);
    label(generate, state.causal ? "吐出下一词并接龙" : "切回因果遮罩");
    reset.disabled = state.history.length === 0;
    const chosen = state.candidate;
    label(last, "Y 的最后一行「" + model.tokens.at(-1) + "」 · y = " + vectorText(model.last));
    label(weight, (state.tied ? "W_lm = Eᵀ，共享第 02 章的词向量表" : "W_lm 使用独立参数表") +
      " ·「" + VOCAB[chosen] + "」这一列 = " + vectorText(model.lmRows[chosen]));
    label(dotProduct, "logit(「" + VOCAB[chosen] + "」) = " + terms(model.last, model.lmRows[chosen]) + " ≈ " + fmt(model.logits[chosen]));
    label(denominator, "Σ e^x = " + model.lm.exps.map(value => fmt(value)).join(" + ") +
      " ≈ " + fmt(model.lm.total) + " · Σ p = " + percent(sum(model.lm.probabilities)));
    candidates.forEach((item, id) => {
      item.pick.setAttribute("aria-pressed", id === chosen);
      label(item.weights, vectorText(model.lmRows[id]));
      label(item.score, fmt(model.logits[id]));
      label(item.exp, fmt(model.lm.exps[id]) + " / " + fmt(model.lm.total));
      label(item.percentLabel, percent(model.lm.probabilities[id]));
      item.percentLabel.classList.toggle("candidate--winner", id === model.winner);
      item.fill.style.setProperty("--portion", model.lm.probabilities[id] * 100 + "%");
    });
    label(sequence, "输入「" + model.tokens.join(" · ") + "」 · " + model.tokens.length + " 个 token");
    label(prediction, "本轮最高概率：「" + VOCAB[model.winner] + "」 " + percent(model.lm.probabilities[model.winner]));
    label(history, state.history.length
      ? "已追加 " + state.history.map(({word, probability}) => "「" + word + "」 " + percent(probability)).join(" → ")
      : "每点一次就将概率最高的词追加到原句。");
  }};
}

const canvas = $("stage-canvas");
const chapterList = $("chapter-list");
const progress = $("chapter-progress");
const noteHolder = $("notes-pages");
const mounts = [mountMap, mountTokens, mountEmbedding, mountPosition, mountProjections, mountAttention, mountNorm, mountFfn, mountReadout];
const pages = chapters.map((chapter, i) => {
  const link = button("", () => go(i), "rail__link");
  put(link, node("span", "rail__number", num(i)), node("span", "", chapter.title));
  chapterList.append(put(node("li"), link));
  const mark = node("span");
  progress.append(mark);
  const root = node("div", "lesson");
  root.hidden = true;
  canvas.append(root);
  const lesson = mounts[i](root);
  const handoff = i > 0 ? mountHandoff(root, i) : null;
  const notes = node("div");
  notes.hidden = true;
  noteHolder.append(notes);
  const itinerary = node("div", "aside__steps");
  itinerary.setAttribute("aria-label", "本章步骤");
  put(notes, itinerary);
  const steps = chapter.steps.map(([title, explanation, example, math], index) => {
    const shortcut = button("", () => setStep(index), "choice");
    put(shortcut, node("span", "step-no", num(index + 1)), node("span", "", title));
    itinerary.append(shortcut);
    const article = node("div", "note-page");
    const formula = node("div", "math");
    math.split("\n").forEach(line => formula.append(node("p", "", line)));
    put(article, node("h3", "", title), node("p", "", explanation), node("blockquote", "", example),
      put(node("details"), node("summary", "", "展开数学公式"), formula));
    notes.append(article);
    return {shortcut, article};
  });
  return {root, link, mark, lesson, handoff, notes, steps};
});

function render() {
  const chapter = chapters[state.chapter];
  const lastStep = chapter.steps.length - 1;
  const view = state.chapter === 0 ? architectureViews[state.tower] : null;
  label($("stage-index"), num(state.chapter));
  label($("stage-title"), chapter.title);
  label($("stage-source-label"), view ? "架构来源" : "数值来源");
  label($("stage-source"), view?.source ?? chapter.source);
  $("architecture-reference").hidden = !view;
  label($("rail-count"), num(state.chapter) + " / 08");
  label($("notes-count"), num(state.step + 1) + " / " + num(chapter.steps.length));
  label($("hud-phase"), "步骤 " + (state.step + 1) + " / " + chapter.steps.length);
  const context = view?.context ??
    (model.tokens.slice(0, 4).join(" · ") + (model.tokens.length > 4 ? " … " + model.tokens.length + " 词" : ""));
  label($("hud-context"), context);
  $("previous").disabled = state.chapter === 0 && state.step === 0;
  $("next").disabled = state.chapter === chapters.length - 1 && state.step === lastStep;
  $("play").setAttribute("aria-pressed", timer !== null);
  label($("play"), timer === null ? "▶ 自动演示" : "Ⅱ 暂停演示");
  pages.forEach((page, i) => {
    const active = i === state.chapter;
    page.root.hidden = page.notes.hidden = !active;
    if (active) page.link.setAttribute("aria-current", "step");
    else page.link.removeAttribute("aria-current");
    page.mark.classList.toggle("is-past", i <= state.chapter);
  });
  const page = pages[state.chapter];
  page.steps.forEach(({shortcut, article}, i) => {
    shortcut.setAttribute("aria-pressed", i === state.step);
    article.hidden = i !== state.step;
  });
  page.lesson.update();
  page.handoff?.update();
  page.root.querySelectorAll("[data-phase]").forEach(item =>
    item.classList.toggle("is-current", +item.dataset.phase === state.step));
}
function modelChanged() {
  model = computePipeline(state.tokens, state.causal, state);
  render();
}
function setPreset(preset) {
  state.preset = preset;
  state.tokens = tokenize(PRESETS[preset]);
  state.row = Math.min(state.row, state.tokens.length - 1);
  state.history = [];
  modelChanged();
}
function pause() {
  clearInterval(timer);
  timer = null;
}
let revealRequest;
function go(chapter, step = 0, {cross = false, autoplay = false, causal = state.causal} = {}) {
  if (chapter < 0 || chapter >= chapters.length) return;
  if (!autoplay) pause();
  cancelAnimationFrame(revealRequest);
  state.chapter = chapter;
  state.step = step;
  state.cross = cross;
  if (chapter === 0 && step > 0) state.tower = step - 1;
  if (causal === state.causal) render();
  else {
    state.causal = causal;
    modelChanged();
  }
  canvas.scrollTop = 0;
  if (step > 0) revealPhase();
}
function revealPhase() {
  cancelAnimationFrame(revealRequest);
  revealRequest = requestAnimationFrame(() => {
    const card = pages[state.chapter].root.querySelector('[data-phase="' + state.step + '"]');
    if (!card) return;
    const stage = canvas.getBoundingClientRect();
    const target = card.getBoundingClientRect();
    if (target.top < stage.top + 5 || target.bottom > stage.bottom - 4) {
      const behavior = matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth";
      canvas.scrollTo({top: canvas.scrollTop + target.top - stage.top - 11, behavior});
    }
  });
}
function setStep(step, {reveal = true} = {}) {
  state.step = step;
  if (state.chapter === 0 && step > 0) state.tower = step - 1;
  render();
  if (reveal) revealPhase();
}
function advance(direction, autoplay = false) {
  if (!autoplay) pause();
  const next = state.step + direction;
  if (next >= 0 && next < chapters[state.chapter].steps.length) {
    setStep(next);
    return;
  }
  const chapter = state.chapter + direction;
  if (chapter >= 0 && chapter < chapters.length) {
    go(chapter, direction > 0 ? 0 : chapters[chapter].steps.length - 1, {autoplay});
  } else {
    pause();
    render();
  }
}
function togglePlay() {
  if (timer !== null) {
    pause();
    render();
    return;
  }
  if ($("next").disabled) go(state.chapter);
  timer = setInterval(() => advance(1, true), 3000);
  render();
}
$("previous").addEventListener("click", () => advance(-1));
$("next").addEventListener("click", () => advance(1));
$("play").addEventListener("click", togglePlay);
document.addEventListener("keydown", event => {
  if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
  const target = event.target;
  if (target instanceof Element && target.closest("input, select, textarea, [contenteditable]")) return;
  if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
    event.preventDefault();
    go(state.chapter + (event.key === "ArrowLeft" ? -1 : 1));
  }
  if (event.code === "Space" || event.key === " ") {
    if (target instanceof Element && target.closest("button, [role='button'], summary, a[href]")) return;
    event.preventDefault();
    if (!event.repeat) togglePlay();
  }
});
const themeButton = $("theme");
function setTheme(night) {
  document.documentElement.dataset.theme = night ? "night" : "day";
  themeButton.setAttribute("aria-pressed", night);
  themeButton.setAttribute("aria-label", night ? "切换日间主题" : "切换夜间主题");
  label(themeButton, night ? "☀ 日间" : "☾ 夜间");
  try { localStorage.setItem("transformer-notebook-theme", night ? "night" : "day"); } catch {}
}
let theme = "day";
try { theme = localStorage.getItem("transformer-notebook-theme") ?? "day"; } catch {}
setTheme(theme === "night");
themeButton.addEventListener("click", () => setTheme(document.documentElement.dataset.theme !== "night"));
render();
</script>
